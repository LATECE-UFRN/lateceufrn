<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia — LATECE — Laboratório de Tecnologia Assistiva UFRN</title>
  <meta name="description" content="Detalhe completo da notícia do Laboratório de Tecnologia Assistiva (LATECE) da UFRN.">
  <link rel="icon" type="image/x-icon" href="./assets/images/logos/favicon.ico">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://vlibras.gov.br">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/utilities.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/accessibility.css">

  <!-- Open Graph (dinâmico via JS, mas com fallback) -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://latece.ufrn.br/news-detail.html">
  <meta property="og:title" content="Notícia — LATECE">
  <meta property="og:description" content="Detalhe da notícia do Laboratório de Tecnologia Assistiva da UFRN.">
  <meta property="og:image" content="https://latece.ufrn.br/assets/images/logos/og-image.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Notícia — LATECE">
  <meta name="twitter:description" content="Detalhe da notícia do LATECE.">
  <meta name="twitter:image" content="https://latece.ufrn.br/assets/images/logos/og-image.jpg">

  <link rel="canonical" href="https://latece.ufrn.br/news-detail.html">

  <!-- Carrega path.js antes dos módulos -->
  <script src="./js/path.js"></script>
</head>
<body>

  <a href="#main-content" class="skip-link">Pular para o conteúdo</a>

  <div id="app">
    <header id="main-header"></header>

    <main id="main-content">

      <!-- ===== HEADER DA NOTÍCIA (visual) ===== -->
      <section class="page-header" style="padding: var(--space-8) 0; background: var(--color-primary-gradient); color: var(--color-white);">
        <div class="container">
          <div class="page-header-content" data-aos="fade-up" data-aos-delay="100">
            <div class="hero-badge" style="background: rgba(255,255,255,0.2); color: white; border: none;">Notícia</div>
            <h1 class="page-header-title" style="font-size: var(--font-size-h1); font-weight: var(--font-extrabold); margin: var(--space-2) 0;">
              <span id="news-detail-title">Carregando...</span>
            </h1>
            <p class="page-header-subtitle" style="font-size: var(--font-size-body-lg); opacity: 0.85;" id="news-detail-date"></p>
            <div class="page-header-actions" style="margin-top: var(--space-4);">
              <a href="./news.html" class="btn btn-secondary" style="background: rgba(255,255,255,0.2); color: white; border-color: rgba(255,255,255,0.3);">← Voltar para Notícias</a>
            </div>
          </div>
        </div>
      </section>

      <!-- Article Container -->
      <section class="news-detail-section" style="padding: clamp(2rem, 4vw, 4rem) 0; min-height: 60vh;">
        <div class="container">
          <div id="news-detail-container" class="news-detail-content" style="max-width: 800px; margin: 0 auto; border-radius: var(--radius-lg); padding: clamp(2rem, 4vw, 3rem);">
            <!-- Loading -->
            <div class="loading-container">
              <div class="loading-spinner"></div>
              <p data-i18n="news.loading">Carregando notícia...</p>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer id="main-footer"></footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
